<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e17"><title>车手账户 — APEX CLUB</title><link rel="stylesheet" href="./site.css"></head>
<body data-page="account"><header class="site-header shell"><a class="site-brand" href="./index.html" aria-label="APEX CLUB 首页"><span class="brand-mark">A<span>↗</span></span><span>APEX <b>CLUB</b></span></a><nav class="site-nav" aria-label="主导航"><a href="./leaderboard.html" data-zh="排行榜" data-en="Leaderboard">排行榜</a><a href="./race.html" data-zh="进入赛场" data-en="Race">进入赛场</a></nav><div class="site-language" role="group" aria-label="Language / 语言"><button type="button" data-language="zh" aria-pressed="true">中</button><button type="button" data-language="en" aria-pressed="false">EN</button></div></header>
<main class="account-page shell"><div class="account-intro"><div class="eyebrow"><span class="eyebrow-line"></span> APEX CLUB / DRIVER ID</div><h1><span data-zh="你的名字，" data-en="Your name.">你的名字，</span><br><span data-zh="你的纪录。" data-en="Your record.">你的纪录。</span></h1><p data-zh="创建车手名，完成三圈比赛，把你的最快整场用时留在全球榜上。" data-en="Claim a driver name, finish three laps, and place your fastest race on the global board.">创建车手名，完成三圈比赛，把你的最快整场用时留在全球榜上。</p><div class="account-rule"><span>01</span><span data-zh="一个车手名，只属于一个人" data-en="One unique name per driver">一个车手名，只属于一个人</span></div><div class="account-rule"><span>02</span><span data-zh="无需邮箱，使用车手名和密码" data-en="No email. Just a name and password.">无需邮箱，使用车手名和密码</span></div><div class="account-rule"><span>03</span><span data-zh="完赛后自动提交更快成绩" data-en="Faster finishes submit automatically">完赛后自动提交更快成绩</span></div></div>
<section class="account-card" aria-label="车手账户"><div id="accountSignedOut"><div class="account-tabs" role="tablist" aria-label="登录或注册"><button type="button" role="tab" id="loginTab" aria-selected="true" data-mode="login" data-zh="登录" data-en="Sign in">登录</button><button type="button" role="tab" id="registerTab" aria-selected="false" data-mode="register" data-zh="注册" data-en="Register">注册</button></div><h2 id="authHeading" data-zh="欢迎回来" data-en="Welcome back">欢迎回来</h2><p id="authDescription" data-zh="登录后继续你的竞速纪录。" data-en="Sign in to continue your racing record.">登录后继续你的竞速纪录。</p><form id="accountForm"><label><span data-zh="车手名" data-en="Driver name">车手名</span><input id="clubPlayerName" name="username" autocomplete="username" maxlength="16" pattern="[A-Za-z0-9_-]{3,16}" required placeholder="3–16 letters / numbers"></label><label><span data-zh="密码" data-en="Password">密码</span><input id="clubPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required placeholder="8+ characters"></label><button id="accountSubmit" class="button button-primary" type="submit"><span data-zh="登录" data-en="Sign in">登录</span><span aria-hidden="true">↗</span></button></form><p id="accountStatus" class="account-status" role="status" aria-live="polite"></p></div><div id="accountSignedIn" hidden><span class="signed-in-mark">✓</span><small>APEX DRIVER / VERIFIED</small><h2 id="signedInName"></h2><p data-zh="已登录。完成比赛后，新的个人最快整场用时会自动参与全球排名。" data-en="Signed in. Faster completed races will enter the global ranking automatically.">已登录。完成比赛后，新的个人最快整场用时会自动参与全球排名。</p><a class="button button-primary" href="./race.html"><span data-zh="进入赛场" data-en="Enter the grid">进入赛场</span><span aria-hidden="true">↗</span></a><button id="clubLogout" class="signout-button" type="button" data-zh="退出登录" data-en="Sign out">退出登录</button></div></section></main><footer class="site-footer shell"><span>© APEX CLUB</span><a href="./leaderboard.html" data-zh="查看排行榜 ↗" data-en="View rankings ↗">查看排行榜 ↗</a></footer><script type="module" src="./site.js"></script></body></html>
